name: Release
on:
  push:
    branches:
      - "main"

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0
  CI: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # A publishing job restores nothing another run wrote.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 renamed `publish` / `commit`, and takes its token from `github-token`, which defaults
        # to this workflow's token; it no longer reads GITHUB_TOKEN from the environment.
        with:
          publish-script: "npm run publish"
          commit-message: "chore(release): version packages"
